name: MTG announcements

on:
  schedule:
    - cron: '7,37 * * * *' # Check every 30 minutes
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mtg-announcements
  cancel-in-progress: false

jobs:
  announcements:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect and post new announcements
        env:
          MTG_WEBHOOK: ${{ secrets.MTG_WEBHOOK }}
          SECRET_LAIR_WEBHOOK: ${{ secrets.SECRET_LAIR_WEBHOOK }}
        run: python mtg_news.py
      - name: Preserve queue and delivery history
        if: always()
        run: |
          if [ ! -f state.json ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update announcement queue and delivery history'
          git push
